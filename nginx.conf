# nginx.conf — Configuração hardened para Zokyo
#
# Fixes aplicados:
#   H01: Content-Security-Policy no Nginx (redundância com Flask)
#   H02: HSTS
#   H03: rate limiting no nível do Nginx
#   C04: X-Forwarded-For controlado pelo Nginx
#   V-10: headers de segurança adicionados no location /static/
#   V-11: removido more_clear_headers (exigia módulo ngx_headers_more não incluso
#         no nginx padrão Ubuntu/Debian). Substituído por proxy_hide_header +
#         server_tokens off (já presente).
#
# Instalar: sudo cp nginx.conf /etc/nginx/sites-available/zokyo
#           sudo ln -s /etc/nginx/sites-available/zokyo /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

# ── Rate limiting ──────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=zokyo_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=zokyo_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=zokyo_api:10m    rate=30r/s;

# Limita conexões simultâneas por IP
limit_conn_zone $binary_remote_addr zone=zokyo_conn:10m;

server {
    listen 80;
    server_name seu-dominio.com.br;

    # Redireciona tudo para HTTPS (H02)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seu-dominio.com.br;

    # ── TLS ─────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout     1d;
    ssl_session_cache       shared:MozSSL:10m;
    ssl_session_tickets     off;

    # OCSP Stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout        5s;

    # ── Limites globais ─────────────────────────────────────────────────
    client_max_body_size    10m;
    client_body_timeout     12;
    client_header_timeout   12;
    send_timeout            10;
    keepalive_timeout       15;

    limit_req  zone=zokyo_global burst=50 nodelay;
    limit_conn zokyo_conn 20;

    # ── Headers de segurança (H01/H02) ──────────────────────────────────
    # HSTS: 1 ano, inclui subdomínios, preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # V-11 FIX: removido more_clear_headers — exigia ngx_headers_more que não
    # vem compilado no nginx padrão do Ubuntu/Debian. Sem esse módulo, o nginx
    # rejeitaria a configuração toda, derrubando a aplicação no deploy.
    # Substituição: server_tokens off (já presente abaixo) esconde a versão
    # do Server header. proxy_hide_header remove o X-Powered-By do upstream.
    server_tokens off;

    # ── Proxy para Gunicorn ──────────────────────────────────────────────
    location / {
        proxy_pass          http://127.0.0.1:8000;
        proxy_set_header    Host              $host;
        # C04: Nginx define o IP real; Flask confia em exatamente 1 proxy
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Real-IP         $remote_addr;
        # Remove headers que o cliente possa injetar
        proxy_set_header    X-Forwarded-Host  "";

        # V-11 FIX: oculta headers do upstream via proxy_hide_header
        # (funciona com nginx padrão, sem módulos extras)
        proxy_hide_header   X-Powered-By;

        proxy_connect_timeout 10;
        proxy_read_timeout    30;
        proxy_send_timeout    30;

        # Buffer para evitar slow-read attacks
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── Rate limiting no login (H03) ─────────────────────────────────────
    location /login {
        limit_req  zone=zokyo_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass          http://127.0.0.1:8000;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Forwarded-For $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_hide_header   X-Powered-By;
    }

    # ── Rate limiting em APIs ────────────────────────────────────────────
    location /api/ {
        limit_req  zone=zokyo_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass          http://127.0.0.1:8000;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Forwarded-For $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_hide_header   X-Powered-By;
    }

    # ── Estáticos ────────────────────────────────────────────────────────
    # V-10 FIX: adicionados headers de segurança explícitos no location /static/.
    # Sem isso, blocos location com add_header próprio não herdam os headers do
    # bloco server{} — comportamento padrão do Nginx com módulo headers.
    # Ao listar explicitamente, garantimos que arquivos JS/CSS/fontes também
    # sejam servidos com as proteções corretas.
    location /static/ {
        alias /var/www/zokyo/app/static/;
        expires 7d;
        add_header Cache-Control         "public, immutable"                         always;
        add_header X-Content-Type-Options "nosniff"                                  always;
        add_header X-Frame-Options        "DENY"                                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"          always;
        access_log off;
    }

    # ── Bloqueia acesso a arquivos sensíveis ─────────────────────────────
    location ~ /\.(env|git|gitignore|htaccess|py|pyc|sh|sql|log)$ {
        deny all;
        return 404;
    }

    # ── Logs ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/zokyo_access.log combined;
    error_log  /var/log/nginx/zokyo_error.log warn;
}
