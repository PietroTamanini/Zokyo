<!DOCTYPE html><html lang="pt-BR" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ APP_NAME }} - Nova senha</title><link rel="stylesheet" href="{{ url_for('static', filename='css/zokyo.css') }}">
</head><body class="auth-page"><main class="auth-shell"><section class="auth-box" aria-labelledby="title">
<div class="auth-head"><div class="auth-brand-lockup"><img src="{{ url_for('static', filename='img/icons/zokyo-icon.svg') }}" alt=""><span>{{ APP_SHORT_NAME }}</span></div><h1 id="title">Definir nova senha</h1><p class="auth-subtitle-lg">Use pelo menos oito caracteres, com maiúscula, minúscula, número e símbolo.</p></div>
{% include 'partials/_flash.html' %}
<form method="POST" data-validate><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label for="senha">Nova senha</label><input id="senha" class="validate-password" data-password-input data-min="8" type="password" name="senha" required minlength="8" autofocus autocomplete="new-password">{% include 'partials/_password_requirements.html' %}</div>
<div class="form-group"><label for="confirmar_senha">Confirmar senha</label><input id="confirmar_senha" type="password" name="confirmar_senha" required data-match="#senha" autocomplete="new-password"></div>
<button class="btn btn-primary btn-block btn-lg" type="submit">Redefinir senha</button></form>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/validators.js') }}"></script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/password-policy.js', v='20261105-1') }}"></script>
</section></main></body></html>
