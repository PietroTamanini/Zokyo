<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ APP_SHORT_NAME }}">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="{{ APP_SHORT_NAME }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/zokyo-icon-192.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/zokyo-favicon.svg') }}">
  <title>Abrindo {{ APP_NAME }}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font: 600 16px Arial, sans-serif;
      padding: 24px;
    }

    main {
      max-width: 360px;
      text-align: center;
    }

    img {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    p {
      color: #94a3b8;
      line-height: 1.5;
      margin: 8px 0 18px;
    }

    a {
      color: #fff;
      background: #2563eb;
      border-radius: 10px;
      display: inline-flex;
      padding: 10px 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="{{ url_for('static', filename='img/icons/zokyo-icon-192.png') }}" alt="">
    <h1>Abrindo {{ APP_SHORT_NAME }}</h1>
    <p>Se nao abrir automaticamente, toque no botao abaixo.</p>
    <a href="{{ target_url }}">Abrir sistema</a>
  </main>
  <script nonce="{{ csp_nonce }}">
    window.location.replace({{ target_url|tojson }});
  </script>
</body>
</html>
