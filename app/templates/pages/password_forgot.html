<!DOCTYPE html><html lang="pt-BR" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ APP_NAME }} - Recuperar senha</title><link rel="stylesheet" href="{{ url_for('static', filename='css/zokyo.css') }}">
</head><body class="auth-page"><main class="auth-shell"><section class="auth-box" aria-labelledby="title">
<div class="auth-head"><div class="auth-brand-lockup"><img src="{{ url_for('static', filename='img/icons/zokyo-icon.svg') }}" alt=""><span>{{ APP_SHORT_NAME }}</span></div><h1 id="title">Recuperar senha</h1><p class="auth-subtitle-lg">Informe seu e-mail para receber um link de uso único.</p></div>
{% include 'partials/_flash.html' %}
<form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label for="email">E-mail</label><input id="email" type="email" name="email" required autofocus autocomplete="email"></div>
<button class="btn btn-primary btn-block btn-lg" type="submit">Enviar instruções</button></form>
<p class="auth-action"><a href="{{ url_for('auth.login_page') }}">Voltar ao login</a></p>
</section></main></body></html>
