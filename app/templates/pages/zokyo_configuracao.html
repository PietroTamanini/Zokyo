{% extends 'base.html' %}
{% block title %}{{ title }} - Zokyo{% endblock %}
{% block breadcrumb %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header zokyo-page-header">
  <div>
    <div class="page-title">{{ title }}</div>
    <div class="page-sub">Dados do emitente e parametros principais do sistema.</div>
  </div>
</div>

<div class="zokyo-widget">
  <div class="widget-title">
    <span class="widget-icon" aria-hidden="true"><svg class="ui-icon"><use href="#i-settings"></use></svg></span>
    <h5>{{ title }}</h5>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="POST" action="{{ url_for('configuracoes.salvar') }}" class="zokyo-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-row fr2">
          <div class="form-group">
            <label>Nome da Empresa *</label>
            <input type="text" name="nome_empresa" required autofocus value="{{ cfg.nome_empresa or '' }}">
          </div>
          <div class="form-group">
            <label>CNPJ</label>
            <input type="text" name="cnpj" class="mask-cnpj" value="{{ cfg.cnpj or '' }}">
          </div>
        </div>
        <div class="form-row fr2">
          <div class="form-group">
            <label>Texto abaixo do nome</label>
            <input type="text" name="subtitulo_empresa" value="{{ cfg.subtitulo_empresa or '' }}" placeholder="Assistência técnica e manutenção">
          </div>
          <div class="form-group">
            <label>Logo</label>
            <input type="url" name="logo_url" value="{{ cfg.logo_url or '' }}" placeholder="https://site.com/logo.png ou /static/img/logo.png">
          </div>
        </div>
        <div class="form-row fr2">
          <div class="form-group">
            <label>Telefone</label>
            <input type="text" name="telefone" class="mask-phone" value="{{ cfg.telefone or '' }}">
          </div>
          <div class="form-group">
            <label>E-mail</label>
            <input type="email" name="email" value="{{ cfg.email or '' }}">
          </div>
        </div>
        <div class="form-row fr3">
          <div class="form-group">
            <label>WhatsApp público</label>
            <input type="text" name="whatsapp_publico" class="mask-phone" value="{{ cfg.whatsapp_publico or '' }}">
          </div>
          <div class="form-group">
            <label>Site</label>
            <input type="url" name="site_url" value="{{ cfg.site_url or '' }}" placeholder="https://suaempresa.com.br">
          </div>
          <div class="form-group">
            <label>Instagram</label>
            <input type="url" name="instagram_url" value="{{ cfg.instagram_url or '' }}" placeholder="https://instagram.com/suaempresa">
          </div>
        </div>
        <div class="form-row fr3">
          <div class="form-group form-span-2">
            <label>Endereço</label>
            <input type="text" name="endereco" value="{{ cfg.endereco or '' }}">
          </div>
          <div class="form-group">
            <label>Cidade</label>
            <input type="text" name="cidade" value="{{ cfg.cidade or '' }}">
          </div>
        </div>
        <div class="form-row fr3">
          <div class="form-group">
            <label>UF</label>
            <input type="text" name="uf" maxlength="2" value="{{ cfg.uf or '' }}">
          </div>
          <div class="form-group">
            <label>Dias de Vencimento</label>
            <input type="number" name="dias_vencimento" min="1" value="{{ cfg.dias_vencimento or 30 }}">
          </div>
          <div class="form-group">
            <label>Chave PIX</label>
            <input type="text" name="pix_chave" value="{{ cfg.pix_chave or '' }}">
          </div>
        </div>
        <div class="form-group">
          <label>Dados de Pagamento / Observações</label>
          <textarea name="dados_pagamento" rows="4">{{ cfg.dados_pagamento or '' }}</textarea>
        </div>
        <div class="form-row fr2">
          <div class="form-group">
            <label>Cor principal</label>
            <input type="color" name="primary_color" value="{{ cfg.primary_color or '#2563eb' }}">
          </div>
          <div class="form-group">
            <label>Cor de destaque</label>
            <input type="color" name="accent_color" value="{{ cfg.accent_color or '#6366f1' }}">
          </div>
        </div>
        <div class="modal-actions">
          <a class="btn btn-ghost" href="{{ url_for('pages.dashboard') }}">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
{% endblock %}
