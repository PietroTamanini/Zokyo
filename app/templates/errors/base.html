<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Erro | Zokyo{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/zokyo-favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css', v='20261106-1') }}">
  <script nonce="{{ csp_nonce }}">
    (() => {
      const stored = localStorage.getItem('theme');
      const theme = stored === 'dark' || stored === 'light'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="zk-error-page">
  <main class="zk-error-shell">
    <header class="zk-error-header">
      <a class="zk-error-brand" href="{{ url_for('auth.login_page') }}" aria-label="Zokyo, ir para o login">
        <span class="zk-error-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M5 5h14L5 19h14"/></svg>
        </span>
        <span>Zokyo</span>
      </a>
      <button class="zk-error-theme" type="button" data-error-theme aria-label="Alternar tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
        <span>Alternar tema</span>
      </button>
    </header>
    {% block error_content %}{% endblock %}
    <footer class="zk-error-footer">
      <span>Central de operação Zokyo</span>
      {% if request_id and code >= 500 %}<span>Referência <code>{{ request_id }}</code></span>{% endif %}
    </footer>
  </main>
  <script nonce="{{ csp_nonce }}">
    (() => {
      const button = document.querySelector('[data-error-theme]');
      if (!button) return;
      button.addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('theme', next);
      });
    })();
  </script>
</body>
</html>
