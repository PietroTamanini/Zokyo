<form method="GET" action="{{ url_for('platform.index') }}" class="admin-filters" role="search" aria-label="Filtrar empresas">
  <input type="hidden" name="view" value="{{ admin_view }}">
  <div class="form-group admin-filter-search"><label for="admin-search">Buscar empresa</label><input type="search" id="admin-search" name="q" value="{{ search_query }}" placeholder="Nome ou subdomínio" maxlength="200"></div>
  <div class="form-group"><label for="admin-status">Situação</label><select id="admin-status" name="status">
    {% for value, label in [('', 'Todas'), ('active', 'Assinatura ativa'), ('active_company', 'Empresas ativas'), ('inactive_company', 'Empresas inativas'), ('trialing', 'Em teste'), ('past_due', 'Em atraso'), ('suspended', 'Suspensas'), ('cancelled', 'Canceladas'), ('dns_pending', 'Domínio pendente')] %}
    <option value="{{ value }}" {{ 'selected' if status_filter == value }}>{{ label }}</option>
    {% endfor %}
  </select></div>
  <button class="btn btn-outline" type="submit"><svg class="ui-icon" aria-hidden="true"><use href="#i-search"></use></svg>Filtrar</button>
  {% if search_query or status_filter %}<a class="btn btn-ghost" href="{{ url_for('platform.index', view=admin_view) }}">Limpar</a>{% endif %}
</form>
