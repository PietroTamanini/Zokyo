<div class="pwa-install" id="pwa-install" role="dialog" aria-labelledby="pwa-install-title" aria-live="polite" hidden>
  <div class="pwa-install-card">
    <button type="button" class="pwa-install-close" id="pwa-install-close" aria-label="Fechar convite de instalação">x</button>
    <div class="pwa-install-top">
      <img class="pwa-install-icon" src="{{ url_for('static', filename='img/icons/zokyo-icon-192.png') }}" alt="">
      <div>
        <div class="pwa-install-kicker">Versão app disponível</div>
        <h2 id="pwa-install-title">Instale o Zokyo</h2>
      </div>
    </div>
    <p class="pwa-install-text" id="pwa-install-text">
      Use o sistema como aplicativo no PC ou celular, com atalho na tela inicial e abertura mais rápida.
    </p>
    <div class="pwa-install-help" id="pwa-install-help" hidden></div>
    <div class="pwa-install-actions">
      <button type="button" class="btn btn-primary" id="pwa-install-primary">Instalar agora</button>
      <button type="button" class="btn btn-ghost" id="pwa-install-later">Agora não</button>
    </div>
  </div>
</div>
