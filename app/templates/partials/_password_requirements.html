<div class="password-policy" data-password-policy>
  <div class="password-policy-heading">
    <span class="password-policy-lock" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    <div><strong>Crie uma senha segura</strong><span data-password-score aria-live="polite">Digite uma senha para conferir</span></div>
  </div>
  <ul class="password-policy-list">
    <li data-password-rule="length"><span class="password-rule-icon" aria-hidden="true"><svg class="password-rule-ok" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><svg class="password-rule-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><span>Pelo menos 8 caracteres</span></li>
    <li data-password-rule="uppercase"><span class="password-rule-icon" aria-hidden="true"><svg class="password-rule-ok" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><svg class="password-rule-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><span>Uma letra maiúscula</span></li>
    <li data-password-rule="lowercase"><span class="password-rule-icon" aria-hidden="true"><svg class="password-rule-ok" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><svg class="password-rule-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><span>Uma letra minúscula</span></li>
    <li data-password-rule="number"><span class="password-rule-icon" aria-hidden="true"><svg class="password-rule-ok" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><svg class="password-rule-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><span>Um número</span></li>
    <li data-password-rule="special"><span class="password-rule-icon" aria-hidden="true"><svg class="password-rule-ok" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><svg class="password-rule-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><span>Um caractere especial</span></li>
    <li data-password-rule="common"><span class="password-rule-icon" aria-hidden="true"><svg class="password-rule-ok" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><svg class="password-rule-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><span>Não usar uma senha comum</span></li>
  </ul>
</div>
