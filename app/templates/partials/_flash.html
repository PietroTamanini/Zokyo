{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div id="flash-container" class="flash-container" aria-live="polite" aria-atomic="true">
      {% for category, message in messages %}
        <div class="alert flash-message a-{{ 'green' if category == 'success' else 'red' if category == 'error' else 'blue' }}" role="{{ 'alert' if category == 'error' else 'status' }}">
          <span aria-hidden="true"><svg class="ui-icon"><use href="#{{ 'i-check' if category == 'success' else 'i-alert' if category == 'error' else 'i-info' }}"></use></svg></span>
          <div>{{ message }}</div>
        </div>
      {% endfor %}
    </div>
    {% if not platform_workspace %}
    <script nonce="{{ csp_nonce }}">setTimeout(()=>{const el=document.getElementById('flash-container');if(el){el.classList.add('fade-out');setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},450);}},7000);</script>
    {% endif %}
  {% endif %}
{% endwith %}
