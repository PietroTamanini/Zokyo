groups:
  - name: zokyo
    rules:
      - alert: ZokyoUnavailable
        expr: up{job="zokyo"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Zokyo indisponivel"}
      - alert: ZokyoHighErrorRate
        expr: sum(rate(zokyo_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(zokyo_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Taxa de HTTP 5xx acima de 2%"}
      - alert: ZokyoHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(zokyo_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Latencia p95 acima de um segundo"}
      - alert: ZokyoLowDisk
        expr: zokyo_disk_free_bytes / zokyo_disk_total_bytes < 0.15
        for: 15m
        labels: {severity: critical}
        annotations: {summary: "Menos de 15% de disco livre"}
      - alert: ZokyoNotificationFailures
        expr: zokyo_notification_queue{status="failed"} > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Existem notificacoes em falha terminal"}
      - alert: ZokyoSchedulerStale
        expr: zokyo_job_heartbeat_age_seconds{job="processar_notificacoes"} > 300
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Scheduler de notificacoes sem heartbeat"}
      - alert: ZokyoJobFailing
        expr: zokyo_job_consecutive_failures > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Tarefa agendada falhando"}
      - alert: ZokyoOperationalCritical
        expr: zokyo_alerts_open{severity="critical"} > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Alerta operacional critico aberto"}
