services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-zokyo}
      MARIADB_USER: ${MYSQL_USER:-zokyo}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-zokyo_dev_password}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zokyo_root_dev_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-0123456789abcdef0123456789abcdef}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-zokyo}:${MYSQL_PASSWORD:-zokyo_dev_password}@db:3306/${MYSQL_DATABASE:-zokyo}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:-MjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjI=}
      REPORTS_UPLOAD_FOLDER: /app/instance/uploads/reports
      SITES_UPLOAD_FOLDER: /app/instance/uploads/sites
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-tamanini.dev.br}
      TENANT_DNS_MODE: ${TENANT_DNS_MODE:-manual}
      REPORTS_PUBLIC_VERIFICATION: "true"
      DJTECH_SITE_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
      REDIS_URL: redis://redis:6379/0
      PRIVACY_REQUEST_LIMIT_PER_HOUR: ${PRIVACY_REQUEST_LIMIT_PER_HOUR:-10}
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_ACCESSLOG: "-"
      GUNICORN_ERRORLOG: "-"
      GUNICORN_WORKERS: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/instance/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  djtech:
    build:
      context: ./dj-tech
    environment:
      HOST: 0.0.0.0
      PORT: 5500
      PANEL_API: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "5500:5500"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5500/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  uploads_data:
  redis_data:
