name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Validate tag format
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Install and test
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: release-validation-secret  # pragma: allowlist secret
        run: |
          pip install -r requirements-dev.txt
          npm ci
          ruff check app tests scripts
          pytest -q
          npm test
          pip-audit -r requirements-prod.txt
          npm audit --audit-level=low
      - name: Validate production readiness contract
        env:
          FLASK_ENV: production
          DATABASE_URL: mysql+pymysql://zokyo:release_ci_password@db:3306/zokyo_ci  # pragma: allowlist secret
          SECRET_KEY: release-production-secret-key-long-value  # pragma: allowlist secret
          ENCRYPTION_SALT: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=  # pragma: allowlist secret
          BLIND_INDEX_KEY: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=  # pragma: allowlist secret
          REQUIRE_ADMIN_2FA: "true"
          PUBLIC_BASE_URL: https://zokyo-release.example.com
          METRICS_TOKEN: mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm  # pragma: allowlist secret
          BACKUP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=  # pragma: allowlist secret
          REPORTS_UPLOAD_FOLDER: /var/lib/zokyo/uploads/reports
          ALERT_EMAIL: ops@example.com
          SMTP_HOST: smtp.example.com
          MAIL_FROM: no-reply@example.com
          WHATSAPP_CLOUD_API_TOKEN: meta-release-token  # pragma: allowlist secret
          WHATSAPP_CLOUD_PHONE_NUMBER_ID: "1234567890"
          WHATSAPP_CLOUD_API_VERSION: v23.0
        run: python -m flask --app wsgi:app production-check --strict-integrations
      - name: Build container
        run: docker build -t zokyo:${GITHUB_REF_NAME} .
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Zokyo ${GITHUB_REF_NAME}"
