name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall app tests
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key
        run: pytest -q
      - name: Coverage
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key
        run: |
          coverage run -m pytest -q
          coverage report
      - name: Validate migrations command
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key
        run: python -m flask --app wsgi:app db current
      - name: Validate templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path("app/templates")
          env = Environment(loader=FileSystemLoader(str(root)))
          for path in root.rglob("*.html"):
              env.parse(path.read_text(encoding="utf-8"))
          print("templates ok")
          PY
      - name: Secret scan baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          needles = ("BEGIN RSA PRIVATE KEY", "BEGIN OPENSSH PRIVATE KEY", "aws_secret_access_key", "ghp_")
          for path in Path(".").rglob("*"):
              if ".git" in path.parts or path.is_dir():
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f"possible secret marker {needle!r} in {path}")
          print("secret markers ok")
          PY

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm install
      - name: Validate WhatsApp server
        run: npm test
