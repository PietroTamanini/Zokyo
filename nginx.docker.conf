limit_req_zone $binary_remote_addr zone=zokyo_global:10m rate=20r/s;
map $request_method $zokyo_login_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $zokyo_login_key zone=zokyo_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=zokyo_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=zokyo_conn:10m;

upstream zokyo_app {
    server app:8000;
    keepalive 16;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/csv
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    limit_conn zokyo_conn 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;

    location / {
        limit_req zone=zokyo_global burst=50 nodelay;
        proxy_pass http://zokyo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Assets nao consomem o limite das paginas. Erros 429 aqui seriam interpretados
    # pelo navegador como CSS/JS e quebrariam a interface inteira.
    location /static/ {
        proxy_pass http://zokyo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Probes de orquestração não podem ser bloqueados pelo rate limit de usuários.
    location = /healthz {
        proxy_pass http://zokyo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://zokyo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        limit_req zone=zokyo_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://zokyo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=zokyo_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://zokyo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?:env|git|htaccess) {
        deny all;
        return 404;
    }
}
