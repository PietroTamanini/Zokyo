services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER:?defina MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-zokyo:local}
    build: .
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?defina ENCRYPTION_SALT}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?defina BLIND_INDEX_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?defina PUBLIC_BASE_URL}
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?defina BACKUP_ENCRYPTION_KEY}
      REPORTS_UPLOAD_FOLDER: /app/instance/uploads/reports
      REPORTS_PUBLIC_VERIFICATION: ${REPORTS_PUBLIC_VERIFICATION:-true}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SSE: ${S3_SSE:-AES256}
      DISABLE_CREATE_ALL: "true"
      SCHEDULER_ENABLED: "false"
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_ACCESSLOG: "-"
      GUNICORN_ERRORLOG: "-"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_FORWARDED_IPS: "*"
      PROXY_COUNT: 1
      REDIS_URL: redis://redis:6379/0
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_ALLOWED_HOSTS: ${ALERT_WEBHOOK_ALLOWED_HOSTS:-}
      WPP_SERVER_URL: ${WPP_SERVER_URL:-}
      WPP_SECRET: ${WPP_SECRET:-}
      WPP_ALLOWED_HOSTS: ${WPP_ALLOWED_HOSTS:-}
      WHATSAPP_CLOUD_API_TOKEN: ${WHATSAPP_CLOUD_API_TOKEN:-}
      WHATSAPP_CLOUD_PHONE_NUMBER_ID: ${WHATSAPP_CLOUD_PHONE_NUMBER_ID:-}
      WHATSAPP_CLOUD_API_VERSION: ${WHATSAPP_CLOUD_API_VERSION:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-true}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
      ASAAS_TIMEOUT: ${ASAAS_TIMEOUT:-15}
      ASAAS_USER_AGENT: ${ASAAS_USER_AGENT:-Zokyo/1.0 (Flask)}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/instance/uploads
    expose:
      - "8000"

  scheduler:
    image: ${APP_IMAGE:-zokyo:local}
    build: .
    restart: unless-stopped
    command: ["python", "-m", "flask", "--app", "wsgi:app", "run-scheduler"]
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?defina ENCRYPTION_SALT}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?defina BLIND_INDEX_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?defina PUBLIC_BASE_URL}
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?defina BACKUP_ENCRYPTION_KEY}
      REPORTS_UPLOAD_FOLDER: /app/instance/uploads/reports
      REPORTS_PUBLIC_VERIFICATION: ${REPORTS_PUBLIC_VERIFICATION:-true}
      DISABLE_CREATE_ALL: "true"
      SCHEDULER_ENABLED: "true"
      PROXY_COUNT: 1
      REDIS_URL: redis://redis:6379/0
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_ALLOWED_HOSTS: ${ALERT_WEBHOOK_ALLOWED_HOSTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/instance/uploads
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    image: ${APP_IMAGE:-zokyo:local}
    build: .
    restart: "no"
    command: ["python", "-m", "flask", "--app", "wsgi:app", "db", "upgrade"]
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?defina ENCRYPTION_SALT}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?defina BLIND_INDEX_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?defina PUBLIC_BASE_URL}
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?defina BACKUP_ENCRYPTION_KEY}
      REPORTS_UPLOAD_FOLDER: /app/instance/uploads/reports
      REPORTS_PUBLIC_VERIFICATION: ${REPORTS_PUBLIC_VERIFICATION:-true}
      DISABLE_CREATE_ALL: "true"
      SCHEDULER_ENABLED: "false"
      PROXY_COUNT: 1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/instance/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  uploads_data:
  redis_data:
